services:
  oracle-free:
    image: gvenzl/oracle-free:slim
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: app_user
      APP_USER_PASSWORD: app_password
    volumes:
      - oracle_free_data:/opt/oracle/oradata

volumes:
  oracle_free_data:
